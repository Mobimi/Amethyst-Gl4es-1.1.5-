name: Build Amethyst IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid cmake wget

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Get iOS SDK path
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Build
        run: |
          make dsym package \
            PLATFORM=2 \
            SDKPATH=${{ env.SDKPATH }} \
            RELEASE=1 \
            RUNNER=1 \
            BOOTJDK=$(dirname $(which javac)) \
            CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-undefined,dynamic_lookup"

      - name: Upload IPA
        uses: actions/upload-artifact@main
        with:
          name: Amethyst-gl4es116-sideload
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa

      - name: Upload TIPA (TrollStore)
        uses: actions/upload-artifact@main
        with:
          name: Amethyst-gl4es116-trollstore
          path: artifacts/org.angelauramc.amethyst-*-trollstore.tipa
