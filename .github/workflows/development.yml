name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: brew install ldid cmake wget make

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Get iOS SDK path
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Download JRE files
        run: |
          mkdir -p depends
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre8-ios-aarch64.zip  -O depends/jre8.zip
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre17-ios-aarch64.zip -O depends/jre17.zip
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre21-ios-aarch64.zip -O depends/jre21.zip

          cd depends
          for ver in 8 17 21; do
            unzip -q jre${ver}.zip -d jre${ver}-tmp

            # Nếu zip chứa một subfolder duy nhất thì đi vào trong đó
            INNER=$(find jre${ver}-tmp -maxdepth 1 -mindepth 1 -type d | head -1)
            if [ -n "$INNER" ] && [ ! -f "jre${ver}-tmp/release" ]; then
              SOURCE="$INNER"
            else
              SOURCE="jre${ver}-tmp"
            fi

            rm -f "$SOURCE/lib/libawt_xawt.dylib"
            tar cJf jre${ver}-ios-aarch64.tar.xz -C "$SOURCE" .
            rm -rf jre${ver}-tmp jre${ver}.zip
          done

          echo "=== Final depends/ ==="
          ls -lh .

      - name: Patch CMakeLists to allow undefined UISolarium symbol
        run: |
          CMAKE_FILE="Natives/CMakeLists.txt"
          if ! grep -q "UISolariumEnabled" "$CMAKE_FILE"; then
            echo "" >> "$CMAKE_FILE"
            echo "target_link_options(AngelAuraAmethyst PRIVATE -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup)" >> "$CMAKE_FILE"
          fi

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
          export SLIMMED=1
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} \
            SDKPATH=${{ env.SDKPATH }} \
            RELEASE=1 \
            RUNNER=1 \
            BOOTJDK=$(dirname $(which javac)) \
            CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 \
            SDKPATH=${{ env.SDKPATH }} \
            RELEASE=1 \
            RUNNER=1 \
            BOOTJDK=$(dirname $(which javac)) \
            CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload AngelAuraAmethyst.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
