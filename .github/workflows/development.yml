name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator

    runs-on: macos-latest
    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Get iOS SDK path
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib

      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Download JRE files
        run: |
          mkdir -p depends
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre8-ios-aarch64.zip  -O depends/jre8.zip
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre17-ios-aarch64.zip -O depends/jre17.zip
          wget -q https://crystall1ne.dev/cdn/amethyst-ios/jre21-ios-aarch64.zip -O depends/jre21.zip

          cd depends
          for ver in 8 17 21; do
            unzip -q jre${ver}.zip -d jre${ver}-tmp

            # Xử lý trường hợp zip chứa subfolder thay vì file trực tiếp
            INNER=$(find jre${ver}-tmp -maxdepth 1 -mindepth 1 -type d | head -1)
            if [ -n "$INNER" ] && [ ! -f "jre${ver}-tmp/release" ]; then
              SOURCE="$INNER"
            else
              SOURCE="jre${ver}-tmp"
            fi

            # Xóa libawt_xawt.dylib để tránh xung đột với bản của Amethyst
            rm -f "$SOURCE/lib/libawt_xawt.dylib"

            tar cJf jre${ver}-ios-aarch64.tar.xz -C "$SOURCE" .
            rm -rf jre${ver}-tmp jre${ver}.zip
          done

          echo "=== Final depends/ ==="
          ls -lh .

      - name: Patch CMakeLists to allow undefined UISolarium symbol
        run: |
          CMAKE_FILE="Natives/CMakeLists.txt"
          if ! grep -q "UISolariumEnabled" "$CMAKE_FILE"; then
            echo "" >> "$CMAKE_FILE"
            echo "target_link_options(AngelAuraAmethyst PRIVATE -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup)" >> "$CMAKE_FILE"
          fi

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export RUNNER=1 SLIMMED=1

          # Build Java tuần tự trước để tránh race condition empty class files
          make -j1 java PLATFORM=${{ matrix.platform }} \
            SDKPATH=${{ env.SDKPATH }} \
            BOOTJDK=$(dirname $(which javac))

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} \
              SDKPATH=${{ env.SDKPATH }} \
              BOOTJDK=$(dirname $(which javac)) \
              CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 \
              SDKPATH=${{ env.SDKPATH }} \
              BOOTJDK=$(dirname $(which javac)) \
              CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 \
              SDKPATH=${{ env.SDKPATH }} \
              BOOTJDK=$(dirname $(which javac)) \
              CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"
          else
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} \
              SDKPATH=${{ env.SDKPATH }} \
              BOOTJDK=$(dirname $(which javac)) \
              CMAKE_EXE_LINKER_FLAGS="-Wl,-w -Wl,-U,__UISolariumEnabled -Wl,-undefined,dynamic_lookup"
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload AngelAuraAmethyst.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
